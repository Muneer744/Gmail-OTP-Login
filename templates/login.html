<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->

            <div class="auth-logo">
                🔐
            </div>


            <!-- Heading -->

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Sign in to continue to your account
            </p>


            <!-- Messages -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Login Form -->

            <form
                action="/login"
                method="POST"
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Gmail Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your Gmail"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- Sign In -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

            </form>


            <!-- Register -->

            <div class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>


            <!-- Security -->

            <div class="security-text">
                🔒 Secure Gmail verification
            </div>

        </div>

    </div>


    <!-- Password Script -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "🙈";

            } else {

                password.type = "password";

                button.textContent = "👁";

            }

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="icon">
                ✅
            </div>

            <h1>Welcome!</h1>

            <p class="subtitle">
                Login successful
            </p>

            <div class="success-box">

                <p>You are successfully verified.</p>

                <p>
                    Logged in as:
                </p>

                <strong>
                    {{ email }}
                </strong>

            </div>

            <a
                href="/logout"
                class="logout-button"
            >
                Logout
            </a>

        </div>

    </div>

</body>

</html>

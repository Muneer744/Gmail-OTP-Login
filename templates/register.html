<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->

            <div class="auth-logo">
                👤
            </div>


            <!-- Heading -->

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your account to get started
            </p>


            <!-- Messages -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Registration Form -->

            <form
                action="/register"
                method="POST"
            >

                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Gmail -->

                <div class="form-group">

                    <label for="email">
                        Gmail Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your Gmail"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirm_password', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Login -->

            <div class="register-text">

                Already have an account?

                <a href="/">
                    Sign In
                </a>

            </div>


            <!-- Security -->

            <div class="security-text">
                🔒 Your account will be verified by Gmail OTP
            </div>

        </div>

    </div>


    <!-- Password Script -->

    <script>

        function togglePassword(
            fieldId,
            button
        ) {

            const field =
                document.getElementById(fieldId);


            if (field.type === "password") {

                field.type = "text";

                button.textContent = "🙈";

            } else {

                field.type = "password";

                button.textContent = "👁";

            }

        }

    </script>

</body>

</html>
